<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" href="">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#4a4a4a">
    <meta name="description" content="いつでも簡単に書き込める">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600&family=Shippori+Mincho:wght@400;600&display=swap"
        rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/memo.css">
</head>

<body>
    <main class="memo-page">

        <!-- カード型UI -->
    <section class="memo-card">

        <!-- タイトル -->
        <h1 class="memo-title">Memo</h1>

        <!-- 日付 -->
        <div class="memo-date">
            <span id="memo-date-text"></span>
        </div>

        <!-- 書き込み欄 -->
        <textarea class="memo-input" placeholder="メモを書いてください"></textarea>

        <!-- ボタン群 -->
        <div class="memo-buttons">
            <button id="memo-reset">リセット</button>
            <button id="memo-back">トップページ</button>
            <button id="memo-save">保存</button>

        </div>

    </section>

    </main>
<script src="/move/memo.js"></script>
</body>

</html>

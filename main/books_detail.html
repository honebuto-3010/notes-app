<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易メモ</title>
    <link rel="stylesheet" href="../css/books_detail.css">
</head>

<body>
    <main class="books-detail-page">

        <!-- タイトル -->
        <h1 class="books-detail-title">Book Detail</h1>

        <!-- 詳細カード -->
        <div class="books-detail-card" id="books-detail-card">

            <!-- JSで内容を挿入 -->
            <div class="detail-item">
                <label>タイトル</label>
                <div id="detail-title" class="detail-value"></div>
            </div>

            <div class="detail-item">
                <label>著者</label>
                <div id="detail-author" class="detail-value"></div>
            </div>

            <div class="detail-item">
                <label>出版社</label>
                <div id="detail-publisher" class="detail-value"></div>
            </div>

            <div class="detail-item">
                <label>金額</label>
                <div id="detail-price" class="detail-value"></div>
            </div>

            <div class="detail-item">
                <label>ジャンル</label>
                <div id="detail-genre" class="detail-value"></div>
            </div>

            <div class="detail-item">
                <label>種類</label>
                <div id="detail-type" class="detail-value"></div>
            </div>

            <div class="detail-item">
                <label>メモ</label>
                <div id="detail-memo" class="detail-value detail-memo"></div>
            </div>

            <div class="detail-item">
                <label>保存日</label>
                <div id="detail-date" class="detail-value"></div>
            </div>

        </div>

        <!-- 戻るボタン -->
        <button id="detail-delete" class="detail-delete-btn">削除</button>
        <button id="detail-back" class="detail-back-btn">本棚</button>


    </main>
<script src="/move/books_detail.js"></script>
</body>

</html>
